name: Nightly database backup

# Every night at 2 AM in India, and on demand from the Actions tab.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the Session pooler connection string from Supabase → Connect (IPv4 works on GitHub)
#   BACKUP_PASSPHRASE   a long random passphrase; keep a copy somewhere safe, it is needed to restore
# The dump is encrypted before upload: this repository is public and anyone signed in to GitHub
# can download its workflow artifacts. See docs/BACKUP-AND-RESTORE.md.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::warning::Backup skipped: set SUPABASE_DB_URL and BACKUP_PASSPHRASE (see docs/BACKUP-AND-RESTORE.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump 17
        if: steps.check.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: steps.check.outputs.ok == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="worker-buddy-$(date -u +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file=db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
            --symmetric --cipher-algo AES256 --output "$name.dump.gpg" db.dump
          rm db.dump
          ls -lh "$name.dump.gpg"

      - name: Keep for 30 days
        if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: '*.dump.gpg'
          retention-days: 30
          if-no-files-found: error
