name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Database rules and flows
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the database from every migration and run the tests
        run: supabase/tests/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in js/*.js sw.js; do node --check "$f"; done
      - run: node tests/countries.test.js

  service-worker:
    name: Service worker version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change to app files needs a new VERSION in sw.js
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.html' css js vendor | grep -v '^admin/' || true)
          if [ -n "$changed" ] && ! git diff "origin/$BASE_REF...HEAD" -- sw.js | grep -q '^+const VERSION'; then
            echo "These app files changed:"; echo "$changed"
            echo "Bump VERSION in sw.js so phones fetch the new release in one go."
            exit 1
          fi
